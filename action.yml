name: Bump Lean dependencies
description: Move a Lake package's own git requires to their latest release tags and its toolchain to the latest stable Lean, and open a pull request.

inputs:
  token:
    description: Token for pushing the branch and opening the PR. The default GITHUB_TOKEN works, but PRs it opens do not trigger CI.
    default: ${{ github.token }}
  owner-pattern:
    description: Regex matched against each require's git URL. Defaults to the repository owner's GitHub account.
    default: ''
  allow-rc-toolchain:
    description: Accept a release whose lean-toolchain is a release candidate.
    default: 'false'
  branch:
    description: Branch the PR is opened from.
    default: lean-bump

outputs:
  changed:
    description: Whether anything was updated.
    value: ${{ steps.base.outputs.changed || steps.bump.outputs.changed }}
  pull-request-url:
    description: URL of the pull request, if one was opened or updated.
    value: ${{ steps.pr.outputs.pull-request-url }}

runs:
  using: composite
  steps:
    - name: Install elan
      shell: bash
      run: |
        if ! command -v elan >/dev/null; then
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
        fi

    - name: Bump
      id: bump
      shell: bash
      env:
        OWNER_PATTERN: ${{ inputs.owner-pattern || format('github\.com[/:]{0}/', github.repository_owner) }}
        ALLOW_RC_TOOLCHAIN: ${{ inputs.allow-rc-toolchain }}
        SUMMARY_FILE: ${{ runner.temp }}/lean-bump-summary.md
      run: bash "$GITHUB_ACTION_PATH/bump.sh"

    - name: Check base branch
      id: base
      if: steps.bump.outputs.changed == 'true'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/check-base.sh"

    - name: Open pull request
      id: pr
      if: steps.base.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ inputs.token }}
        branch: ${{ inputs.branch }}
        delete-branch: true
        commit-message: 'Bump ${{ steps.bump.outputs.bumped }}'
        title: 'Bump ${{ steps.bump.outputs.bumped }}'
        body-path: ${{ runner.temp }}/lean-bump-summary.md
