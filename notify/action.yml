name: Notify Lean packages
description: Send a repository_dispatch event to every Lake package in the account, so each one's lean-bump workflow runs now.

inputs:
  token:
    description: Token that can read and dispatch to every repository in the account. GITHUB_TOKEN cannot reach other repositories.
    required: true
  owner:
    description: Account whose repositories are notified.
    default: ${{ github.repository_owner }}
  event-type:
    default: lean-dependency-released

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        OWNER: ${{ inputs.owner }}
        SOURCE: ${{ github.repository }}
        EVENT_TYPE: ${{ inputs.event-type }}
      run: bash "$GITHUB_ACTION_PATH/notify.sh"
