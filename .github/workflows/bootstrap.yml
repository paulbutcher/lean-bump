name: Bootstrap

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report what would happen without changing anything.
        type: boolean
        default: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./bootstrap.sh
        env:
          GITHUB_TOKEN: ${{ secrets.LEAN_BUMP_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          DRY_RUN: ${{ inputs.dry-run }}
